[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manim-handdraw"
version = "0.1.0"
description = "Turn a line-art bitmap into a progressive hand-drawn animation in Manim."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FTZ-OPUS", email = "1710644976@qq.com" }]
keywords = [
    "manim",
    "animation",
    "hand-drawn",
    "line-art",
    "skeletonization",
    "vectorization",
    "education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "manim>=0.18",
    "numpy>=1.23",
]

[project.optional-dependencies]
# 图像 -> 笔画 的抽取层。只有用到 from_image / CLI prep 才需要装。
extract = ["scikit-image>=0.20", "scipy>=1.9", "Pillow>=9.5"]
dev = [
    "pytest>=7.0",
    "scikit-image>=0.20",
    "scipy>=1.9",
    "Pillow>=9.5",
]

[project.urls]
Homepage = "https://github.com/FTZ-OPUS/manim-handdraw"
Repository = "https://github.com/FTZ-OPUS/manim-handdraw"
Issues = "https://github.com/FTZ-OPUS/manim-handdraw/issues"

# 注册成 Manim 插件：装了之后 manim 启动时会自动加载本包。
[project.entry-points."manim.plugins"]
manim_handdraw = "manim_handdraw"

[project.scripts]
manim-handdraw = "manim_handdraw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manim_handdraw"]

[tool.hatch.build.targets.sdist]
include = [
    "src/manim_handdraw",
    "examples",
    "tests",
    "README.md",
    "README.zh-CN.md",
    "LICENSE",
    "CHANGELOG.md",
]
